[package]
name = "iris-gpui"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false
description = "Iris's interface in GPUI: a trial of the answer panel."

[[bin]]
name = "iris"
path = "src/main.rs"

[features]
default = ["tooling"]
# GPUI's headless Metal renderer (`--snap`), behind GPUI's test support. Off, the app links
# only its window: what a shipped Iris would be.
tooling = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
# GPUI is pre-1.0 and its crates.io release is a year old: pin Zed's main at a rev.
gpui = { git = "https://github.com/zed-industries/zed", rev = "77228009dd267dcf8ab9a20eef5802b2a8ea4afa", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "77228009dd267dcf8ab9a20eef5802b2a8ea4afa", default-features = false, features = ["font-kit"] }
tiny-skia = "0.11"
skrifa = "0.44"
rustybuzz = "0.20"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
raw-window-handle = "0.6"
# The flower's arrival: the local day (the first one each day is full) and its now-and-then roll.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fastrand = "2"

# Zed's own patches of crates GPUI uses (a git dependency doesn't inherit them).
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task", rev = "41fd3359c75e221bd8b187a8ee361aa309c1714c" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = "s"

[profile.release.package.tiny-skia]
opt-level = 3

# The live test panel refuses the keyboard (see `main.rs`, `refuse_keys`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSDate", "NSData", "NSGeometry", "NSString", "NSArray", "NSObject", "NSBundle"] }
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics = "0.24"
foreign-types = "0.5"
objc2-core-graphics = { version = "0.3", features = ["CGColorSpace", "CGImage"] }
objc2-app-kit = { version = "0.3", features = ["block2", "NSMenu", "NSMenuItem", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSImage", "NSWindow", "NSScreen", "NSAppearance", "NSApplication", "NSCell", "NSButtonCell", "NSGraphics", "NSEvent", "NSOpenPanel", "NSSavePanel", "NSPanel"] }

[build-dependencies]
# Windows: the program's icon, built into iris.exe (build.rs).
embed-resource = "3"

# Windows: the notification-area (tray) icon and its menu, the system's own (`tray.rs`).
[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
async-channel = "2"
# Updates: a release's manifest checked against Iris's own signature (`update_win.rs`).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
windows = { version = "0.62", features = ["Win32_UI_HiDpi", "Win32_System_Registry", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_JobObjects", "Win32_Security", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_Globalization", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs"] }
