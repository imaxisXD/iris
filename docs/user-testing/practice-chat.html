<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice chat</title>
<style>
  :root { --bg:#f8f8f8; --panel:#fff; --text:#171717; --muted:#6f6f6f; --border:#e5e5e5; --accent:#034cff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101010; --panel:#161616; --text:#ededed; --muted:#9a9a9a; --border:#282828; --accent:#9dbefe; } }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  .app { max-width: 820px; margin: 0 auto; height: 100vh; display:flex; flex-direction:column; padding: 16px; }
  header { padding: 8px 4px 12px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 17px; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .messages { flex:1; overflow:auto; padding: 12px 4px; }
  .msg { margin: 10px 0; }
  .who { font-weight: 600; font-size: 14px; }
  .when { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .composer { border:1px solid var(--border); border-radius: 10px; background: var(--panel); padding: 10px 12px; }
  .box { min-height: 48px; outline: none; white-space: pre-wrap; }
  .box:empty:before { content: attr(data-placeholder); color: var(--muted); }
  .row { display:flex; justify-content: space-between; align-items:center; margin-top: 8px; }
  .hint { color: var(--muted); font-size: 12px; }
  button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .notice { color: var(--muted); font-size: 12px; margin-top: 6px; min-height: 16px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1># ops-team</h1>
    <p>Practice page. Nothing here is sent anywhere. Enter adds a new line; it never posts.</p>
  </header>
  <div class="messages" id="messages">
    <div class="msg"><span class="who">Team lead</span><span class="when">9:12 AM</span><div>Morning all. Can someone confirm the status of the delayed order before 11?</div></div>
    <div class="msg"><span class="who">Warehouse</span><span class="when">9:20 AM</span><div>It's on the truck, should land tomorrow.</div></div>
  </div>
  <div class="composer">
    <div class="box" id="box" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Message #ops-team" data-placeholder="Message #ops-team"></div>
    <div class="row">
      <span class="hint">Practice only</span>
      <button id="send" type="button">Send (practice)</button>
    </div>
    <div class="notice" id="notice" aria-live="polite"></div>
  </div>
</div>
<script>
  // "Send" only copies the text into the list on this page, so a tester can see the final result.
  const box = document.getElementById('box');
  document.getElementById('send').addEventListener('click', () => {
    const text = box.innerText.trim();
    if (!text) return;
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = '<span class="who">You (practice)</span><span class="when">now</span><div></div>';
    div.lastChild.textContent = text;
    document.getElementById('messages').appendChild(div);
    box.textContent = '';
    document.getElementById('notice').textContent = 'Added to this page only. Nothing was sent.';
  });
</script>
</body>
</html>
